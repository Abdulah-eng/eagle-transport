version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: eagle_transport_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eagle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eagle_secret}
      POSTGRES_DB: ${POSTGRES_DB:-eagle_transport}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eagle -d eagle_transport"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eagle_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@eaglebus.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
